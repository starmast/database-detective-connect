name: Bug report
description: Something in DD Connect isn't working.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! DD Connect is an unofficial fan mod, so please report problems here, not to the game's developers.

        Before you start, check the [Troubleshooting](https://github.com/starmast/database-detective-connect#troubleshooting) section of the README.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include any error messages you saw in the game or in your editor.
      placeholder: After I saved a table in-game, it never showed up in current.db.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What were you doing in the game and in your editor when it happened?
      placeholder: |
        1. Load case 9
        2. Run a search and save it as a table
        3. Refresh the table list in SQLTools
    validations:
      required: true

  - type: dropdown
    id: without-mod
    attributes:
      label: Does it still happen with DD Connect removed?
      description: Temporarily move `BepInEx\plugins\DDConnect` out of the game folder and try again. If the problem still happens, it's probably a game bug rather than a DD Connect bug.
      options:
        - "No, it only happens with DD Connect installed"
        - "Yes, it happens without DD Connect too"
        - "I haven't checked"
    validations:
      required: true

  - type: input
    id: ddconnect-version
    attributes:
      label: DD Connect version
      description: Shown in `BepInEx\LogOutput.log` as `Loading [DD Connect x.y.z]`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: bepinex-version
    attributes:
      label: BepInEx version
      description: The first line of `BepInEx\LogOutput.log`.
      placeholder: "5.4.23.6"
    validations:
      required: true

  - type: input
    id: level
    attributes:
      label: Which case/level were you on?
      description: "`SELECT * FROM _mirror_info;` shows the level the mirror holds."
      placeholder: "Level 9"

  - type: input
    id: editor
    attributes:
      label: SQL editor
      description: Which editor or tool were you using to open `current.db`?
      placeholder: VS Code with SQLTools

  - type: textarea
    id: log
    attributes:
      label: BepInEx log
      description: |
        Attach or paste `BepInEx\LogOutput.log` from the game folder. Copy it right after the problem happens, before you restart the game, because each launch overwrites it.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the README's Troubleshooting section.
          required: true
        - label: I searched existing issues and this hasn't been reported yet.
          required: true

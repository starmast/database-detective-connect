name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # BepInEx parses the plugin version with System.Version, so suffixes like -beta are rejected.
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)"
              exit 1
            fi
          else
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' DDConnect/DDConnect.csproj | head -n1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build DDConnect -c Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Stage package
        run: |
          mkdir -p package/BepInEx/plugins/DDConnect
          cp DDConnect/bin/Release/DDConnect.dll README.md LICENSE package/BepInEx/plugins/DDConnect/

      - uses: actions/upload-artifact@v4
        with:
          name: DDConnect-${{ steps.version.outputs.version }}
          path: package/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DDConnect-${{ needs.build.outputs.version }}
          path: package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          zip_name="DDConnect-$VERSION.zip"
          (cd package && zip -r "../$zip_name" BepInEx)
          gh release create "$GITHUB_REF_NAME" "$zip_name" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DD Connect $VERSION" \
            --generate-notes \
            --verify-tag

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # BepInEx parses the plugin version with System.Version, so suffixes like -beta are rejected.
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)"
              exit 1
            fi
          else
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' DDConnect/DDConnect.csproj | head -n1)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build DDConnect -c Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      - name: Test ddsql
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet test ddsql.Tests -c Release -p:Version="$VERSION"

      - name: Publish ddsql
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ddsql-package
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish ddsql -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -o "publish/$rid"
          done
          cp publish/win-x64/ddsql.exe ddsql-package/ddsql-win-x64.exe
          cp publish/linux-x64/ddsql ddsql-package/ddsql-linux-x64
          cp publish/osx-arm64/ddsql ddsql-package/ddsql-osx-arm64

      - name: Stage package
        run: |
          mkdir -p package/BepInEx/plugins/DDConnect
          cp DDConnect/bin/Release/DDConnect.dll README.md LICENSE package/BepInEx/plugins/DDConnect/

      - uses: actions/upload-artifact@v7
        with:
          name: DDConnect-${{ steps.version.outputs.version }}
          path: package/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ddsql-${{ steps.version.outputs.version }}
          path: ddsql-package/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DDConnect-${{ needs.build.outputs.version }}
          path: package

      - uses: actions/download-artifact@v8
        with:
          name: ddsql-${{ needs.build.outputs.version }}
          path: ddsql-package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          zip_name="DDConnect-$VERSION.zip"
          (cd package && zip -r "../$zip_name" BepInEx)
          gh release create "$GITHUB_REF_NAME" "$zip_name" ddsql-package/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DD Connect $VERSION" \
            --generate-notes \
            --verify-tag
